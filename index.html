<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misión Espacial: Registro y Juego</title>
    <style>
        body {
            background-color: #0b0b1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #00ffff;
            font-size: 1.3rem;
            text-align: center;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(0,255,255,0.5);
        }
        .subtitle {
            color: #ffaa00;
            font-size: 0.85rem;
            margin-bottom: 10px;
            text-align: center;
        }
        .card {
            background-color: #12122b;
            border: 1px solid #444466;
            border-radius: 10px;
            padding: 20px;
            width: 100%;
            max-width: 600px;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            color: #00ff88;
            margin-bottom: 5px;
            font-size: 0.95rem;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #333366;
            background-color: #1a1a3a;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
        }
        canvas {
            background-color: #050510;
            border: 2px solid #3333ff;
            border-radius: 8px;
            max-width: 100%;
            box-shadow: 0 0 15px rgba(51,51,255,0.3);
        }
        .reading-box {
            font-size: 0.95rem;
            line-height: 1.4;
            color: #e0e0ff;
            margin-bottom: 12px;
            border-left: 4px solid #ffaa00;
            padding-left: 10px;
            max-height: 110px;
            overflow-y: auto;
        }
        .question-title {
            color: #00ff88;
            font-size: 0.95rem;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .option-label {
            display: block;
            background-color: #1a1a3a;
            border: 1px solid #333366;
            border-radius: 6px;
            padding: 8px 10px;
            margin: 6px 0;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .option-label:hover {
            background-color: #2a2a5a;
            border-color: #00ffff;
        }
        input[type="radio"] {
            margin-right: 8px;
        }
        .btn {
            background-color: #00aa55;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #00cc66;
        }
        .alert-box {
            margin-top: 8px;
            padding: 8px;
            border-radius: 5px;
            font-size: 0.85rem;
            display: none;
        }
        .alert-error {
            background-color: rgba(255, 0, 0, 0.2);
            border: 1px solid #ff4444;
            color: #ff8888;
        }
        .alert-success {
            background-color: rgba(0, 255, 136, 0.2);
            border: 1px solid #00ff88;
            color: #88ffcc;
        }
        #gameArea, #congratsArea {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>

    <h1>🚀 MISIÓN ESPACIAL: FÍSICA Y VOCABULARIO 🚀</h1>
    <div class="subtitle">Colegio San Ignacio Fe y Alegría</div>

    <!-- PANTALLA 1: REGISTRO DE DATOS -->
    <div class="card" id="registroArea">
        <h3 style="color: #00ffff; margin-top:0;">Registro del Estudiante</h3>
        <div class="input-group">
            <label>Nombre y Apellido:</label>
            <input type="text" id="txtNombre" placeholder="Ej. Sofia Gomez" required>
        </div>
        <div class="input-group">
            <label>Curso (Ej. 901):</label>

        </div>
        <button class="btn" onclick="iniciarMision()">Iniciar Misión Espacial</button>
    </div>

    <!-- PANTALLA 2: JUEGO -->
    <div id="gameArea">
        <div class="progress-indicator" id="progressIndicator" style="font-size: 0.8rem; color: #a0a0c0; margin-bottom: 5px; text-align: right; width: 100%; max-width: 750px;">Progreso: Nivel 1 de 20</div>
        <canvas id="spaceCanvas" width="750" height="120"></canvas>
        <div class="card" style="margin-top: 10px;">
            <div class="reading-box" id="readingText"></div>
            <div class="question-title" id="questionTitle"></div>
            <div id="optionsContainer"></div>
            <div id="alertBox" class="alert-box"></div>
            <button class="btn" id="actionBtn" onclick="verificarRespuesta()">Comprobar Respuesta</button>
        </div>
    </div>

    <!-- PANTALLA 3: FINALES -->

        <h2 style="color: #00ff88;">🌟 ¡MISIÓN COMPLETADA! 🌟</h2>

        <p style="color: #ffaa00; font-size: 0.9rem;">Tus resultados y consultas a la IA han sido registrados exitosamente en la base de datos del docente.</p>
    </div>

            {

        let nivelActual = 0;
        let intentosFallidos = 0;

        function iniciarMision() {
            const nombre = document.getElementById("txtNombre").value.trim();
            const curso = document.getElementById("txtCurso").value.trim();

            if (!nombre || !curso) {
                alert("Por favor ingresa tu nombre y tu curso para continuar.");
                return;
            }

            estudiante.nombre = nombre;
            estudiante.curso = curso;

            document.getElementById("registroArea").style.display = "none";
            document.getElementById("gameArea").style.display = "flex";
            cargarNivel();
        }

        function dibujarEscenario(progreso) {
            const canvas = document.getElementById("spaceCanvas");
            const ctx = canvas.getContext("2d");
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = "#ffffff";
            for (let i = 0; i < 30; i++) {
                let rx = (i * 27) % canvas.width;
                let ry = (i * 13) % canvas.height;
                ctx.fillRect(rx, ry, 2, 2);
            }

            ctx.beginPath();
            ctx.moveTo(30, 60);
            ctx.lineTo(720, 60);
            ctx.strokeStyle = "#444466";
            ctx.lineWidth = 2;
            ctx.setLineDash([3, 3]);
            ctx.stroke();
            ctx.setLineDash([]);

            let posX = 30 + (progreso * 36.3);

            ctx.fillStyle = "#ff3333";
            ctx.beginPath();
            ctx.moveTo(posX, 48);
            ctx.lineTo(posX + 24, 60);
            ctx.lineTo(posX, 72);
            ctx.fill();

            ctx.fillStyle = "#ffaa00";
            ctx.beginPath();
            ctx.moveTo(posX + 24, 60);
            ctx.lineTo(posX + 32, 60);
            ctx.lineTo(posX + 24, 72);
            ctx.fill();

            ctx.fillStyle = "#00ffff";
            ctx.beginPath();
            ctx.arc(posX + 12, 60, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#ff4400";
            ctx.beginPath();
            ctx.moveTo(posX - 10, 56);
            ctx.lineTo(posX, 60);
            ctx.lineTo(posX - 10, 64);
            ctx.fill();
        }

        function cargarNivel() {
            const alertBox = document.getElementById("alertBox");
            alertBox.style.display = "none";

            if (nivelActual < JUEGO_DATOS.length) {
                const item = JUEGO_DATOS[nivelActual];
                document.getElementById("progressIndicator").innerText = `Progreso: Nivel ${nivelActual + 1} de 20`;
                document.getElementById("readingText").innerHTML = item.texto;
                document.getElementById("questionTitle").innerText = `Vocabulario (${nivelActual + 1}/20): ¿Qué significa '[ ${item.palabra.toUpperCase()} ]'?`;

                let opcionesHtml = "";
                item.opciones.forEach((op, index) => {
                    opcionesHtml += `
                        <label class="option-label">
                            <input type="radio" name="opcion" value="${index}"> ${op}
                        </label>
                    `;
                });
                document.getElementById("optionsContainer").innerHTML = opcionesHtml;
                dibujarEscenario(nivelActual);
                intentosFallidos = 0;
            } else {
                document.getElementById("gameArea").style.display = "none";
                document.getElementById("congratsArea").style.display = "block";
                document.getElementById("resumenFinal").innerHTML = `Estudiante: <b>${estudiante.nombre}</b><br>Curso: <b>${estudiante.curso}</b><br>Total de veces que requirió consultar la IA por errores: <b style="color:#ff4444;">${estudiante.erroresTotales}</b>`;
                enviarDatosAGoogleSheets();
            }
        }

        function verificarRespuesta() {
            const radios = document.getElementsByName("opcion");
            let seleccionada = -1;
            for (let i = 0; i < radios.length; i++) {
                if (radios[i].checked) {
                    seleccionada = parseInt(radios[i].value);
                    break;
                }
            }

            const alertBox = document.getElementById("alertBox");

            if (seleccionada === -1) {
                alertBox.className = "alert-box alert-error";
                alertBox.innerText = "Por favor selecciona una opción de respuesta.";
                alertBox.style.display = "block";
                return;
            }

            const item = JUEGO_DATOS[nivelActual];
            if (seleccionada === item.correcta) {
                alertBox.className = "alert-box alert-success";
                alertBox.innerText = "🎉 ¡Correcto! Tu nave avanza a la siguiente estación espacial.";
                alertBox.style.display = "block";
                setTimeout(() => {
                    nivelActual++;
                    cargarNivel();
                }, 1100);
            } else {
                intentosFallidos++;
                estudiante.erroresTotales++; // Sumamos al contador de errores / consultas a IA
                alertBox.className = "alert-box alert-error";
                if (intentosFallidos === 1) {
                    alertBox.innerHTML = `❌ ¡Incorrecto! <b>Acción requerida:</b> Busca el significado de <i>'${item.palabra}'</i> en una IA y responde de nuevo.`;
                } else {
                    alertBox.innerHTML = `💡 Pista: ${item.pista}`;
                }
                alertBox.style.display = "block";
            }
        }

        function enviarDatosAGoogleSheets() {
            if (URL_GOOGLE_SHEETS.includes("https://script.google.com/macros/s/AKfycbyyJI8JufFtwk0pBNyv-bJdsD9TIXESvfXaHEjYRSt53RmwvIB7mstSY7bMYWhevsUV/exec")) return; // Evita error si no está configurado
            
            const datos = {
                nombre: estudiante.nombre,
                curso: estudiante.curso,
                errores: estudiante.erroresTotales,
                fecha: new Date().toLocaleString()
            };

            fetch(URL_GOOGLE_SHEETS, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(datos)
            }).catch(error => console.error("Error al enviar datos:", error));
        }
    </script>
